name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy with all features
        run: cargo clippy --all-features --all-targets -- -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Publish dry-run
        run: cargo publish --dry-run

  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
      - name: Setup hadoop env
        shell: bash
        run: |
          curl -LsSf https://dlcdn.apache.org/hadoop/common/hadoop-3.3.5/hadoop-3.3.5.tar.gz | tar zxf - -C /home/runner
          echo "HADOOP_HOME=/home/runner/hadoop-3.3.5" >> $GITHUB_ENV

      - name: Test
        shell: bash
        run: |
          export CLASSPATH=$(${HADOOP_HOME}/bin/hadoop classpath --glob)
          cargo test --features async_file -- --nocapture
        env:
          LD_LIBRARY_PATH: ${{ env.JAVA_HOME }}/lib/server:${{ env.HADOOP_HOME}}/lib/native
          HDRS_TEST: on
          HDRS_NAMENODE: default
          HDRS_WORKDIR: /tmp/hdrs/

  test-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Hdfs
        # namenode will use ports: 9870, 9000, 8020
        # datanode will use ports: 9864
        run: |
          docker run -d \
            --name namenode \
            --network host \
            -e CLUSTER_NAME=test \
            -e WEBHDFS_CONF_dfs_webhdfs_enabled=true \
            -e CORE_CONF_hadoop_http_staticuser_user=root \
            -e HDFS_CONF_dfs_permissions_enabled=false \
            bde2020/hadoop-namenode:2.0.0-hadoop3.1.3-java8

          docker run -d \
            --name datanode \
            --network host \
            -e CLUSTER_NAME=test \
            -e WEBHDFS_CONF_dfs_webhdfs_enabled=true \
            -e CORE_CONF_hadoop_http_staticuser_user=root \
            -e HDFS_CONF_dfs_permissions_enabled=false \
            bde2020/hadoop-datanode:2.0.0-hadoop3.1.3-java8

          curl --retry 30 --retry-delay 1 --retry-connrefused http://localhost:9870

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
      - name: Setup hadoop env
        shell: bash
        run: |
          # The namenode image already contains the 3.1.3 client used by this cluster.
          # That image exports HADOOP_PREFIX, not HADOOP_HOME.
          # archive.apache.org throttles that historical tarball.
          hadoop_home="$(docker exec namenode sh -c 'if [ -n "$HADOOP_HOME" ]; then printf %s "$HADOOP_HOME"; elif [ -n "$HADOOP_PREFIX" ]; then printf %s "$HADOOP_PREFIX"; else dirname "$(dirname "$(readlink -f /etc/hadoop)")"; fi')"
          echo "resolved hadoop home: $hadoop_home"
          test -n "$hadoop_home"
          docker exec namenode test -x "$hadoop_home/bin/hadoop"
          version="$(docker exec namenode "$hadoop_home/bin/hadoop" version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -q 'Hadoop 3\.1\.3'
          docker exec namenode test -d "$hadoop_home/lib/native"
          rm -rf /home/runner/hadoop-3.1.3
          docker cp "namenode:${hadoop_home}" /home/runner/hadoop-3.1.3
          test -x /home/runner/hadoop-3.1.3/bin/hadoop
          test -d /home/runner/hadoop-3.1.3/lib/native
          echo "HADOOP_HOME=/home/runner/hadoop-3.1.3" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          export CLASSPATH=$(${HADOOP_HOME}/bin/hadoop classpath --glob)
          cargo test --features async_file -- --nocapture
        env:
          LD_LIBRARY_PATH: ${{ env.JAVA_HOME }}/lib/server:${{ env.HADOOP_HOME }}/lib/native
          HDRS_TEST: on
          HDRS_INTEGRATED_TEST: on
          HDRS_NAMENODE: hdfs://localhost:8020
          HDRS_WORKDIR: /tmp/hdrs/

  test-vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
      - name: Setup hadoop env
        shell: bash
        run: |
          curl -LsSf https://dlcdn.apache.org/hadoop/common/hadoop-3.3.5/hadoop-3.3.5.tar.gz | tar zxf - -C /home/runner
          echo "HADOOP_HOME=/home/runner/hadoop-3.3.5" >> $GITHUB_ENV

      - name: Test
        shell: bash
        run: |
          export CLASSPATH=$(${HADOOP_HOME}/bin/hadoop classpath --glob)
          cargo test --features async_file,vendored -- --nocapture
        env:
          # If vendored has been enabled, we don't need to load native libs
          LD_LIBRARY_PATH: ${{ env.JAVA_HOME }}/lib/server
          HDRS_TEST: on
          HDRS_NAMENODE: default
          HDRS_WORKDIR: /tmp/hdrs/
